<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263d48"><meta property="og:title" content="Fruit & Blade"><meta property="og:description" content="Slice fruit and blend fresh juice."><meta property="og:image" content="https://kevinkaslana093.github.io/watermelon-english/preview.png"><meta property="og:url" content="https://kevinkaslana093.github.io/watermelon-english/"><meta property="og:type" content="website"><title>Fruit & Blade</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#263d48}body{display:flex;align-items:center;justify-content:center}iframe{display:block;flex-shrink:0;width:390px;height:844px;border:0;transform-origin:center;background:#83d2db}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:#fff;background:#263d48;font:18px system-ui}#loading[hidden]{display:none}button{padding:12px 24px;background:#a5e9d6;border:0;border-radius:16px;color:#263d48;font:inherit}</style>
</head><body><iframe title="Fruit slicing game" allow="autoplay; fullscreen 'none'"></iframe><div id="loading" role="status"><span id="message">Loading game…</span><button id="reload" hidden>Reload</button></div>
<script>
const frame=document.querySelector('iframe');
function fit(){frame.style.transform='scale('+Math.min(1,innerWidth/390,innerHeight/844)+')';}addEventListener('resize',fit,{passive:true});fit();
document.querySelector('#reload').onclick=()=>location.reload();setTimeout(()=>document.querySelector('#reload').hidden=false,30000);
const ready=setInterval(()=>{try{const w=frame.contentWindow;if(!w.cc)return;const n=w.cc.find('Canvas/homeView/homeDisplay'),retry=w.cc.find('Canvas/LoadingRetry/Panel');if((n&&n.activeInHierarchy)||(retry&&retry.activeInHierarchy)){document.querySelector('#loading').hidden=true;clearInterval(ready);}}catch(e){}},150);
fetch('./game-v1-r25/index.html').then(r=>{if(!r.ok)throw Error('load');return r.text();}).then(html=>{const base=new URL('./game-v1-r25/',location.href).href,scope=new URL('./storage-scope.js',location.href).href;frame.srcdoc=html.replace(/<head(?:\s[^>]*)?>/i,tag=>tag+'<base href="'+base+'"><script src="'+scope+'"><\/script>');}).catch(()=>{document.querySelector('#message').textContent='Could not load game';document.querySelector('#reload').hidden=false;});
</script></body></html>
